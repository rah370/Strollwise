services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: strollwise
      POSTGRES_USER: strollwise
      POSTGRES_PASSWORD: strollwise
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strollwise -d strollwise"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg2://strollwise:strollwise@db:5432/strollwise
      REDIS_URL: redis://redis:6379/0
      SEED_ON_BOOT: "${SEED_ON_BOOT:-false}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

volumes:
  postgres_data:
